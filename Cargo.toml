[package]
name = "megalodon"
version = "1.3.0"
edition = "2021"
authors = ["Akira Fukushima <h3.poteto@gmail.com>"]
description = "Fediverse API client library for Rust."
license = "MIT"
repository = "https://github.com/h3poteto/megalodon-rs"
homepage = "https://github.com/h3poteto/megalodon-rs"

[package.metadata.docs.rs]
features = []

[features]
default = []

[dependencies]
async-trait = "0.1.80"
chrono = { version = "0.4.38", features = ["serde"] }
futures-util = "0.3.30"
hex = "0.4"
mime_guess = "2.0"
oauth2 = "5.0"
rand = "0.9"
regex = "1.10.4"
reqwest = { version = "0.12.3", features = [
    "json",
    "multipart",
    "stream",
], default-features = false }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
sha1 = "0.10"
thiserror = "2.0.12"
tokio = { version = "1.37.0", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["url"] }
tokio-util = { version = "0.7.10", features = ["codec"] }
tracing = "0.1.40"
url = "2.5.0"
urlencoding = "2.1"
uuid = { version = "1.8", features = ["v4"] }
tower-service = "0.3.3"
http = "1.5.0"

[dev-dependencies]
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
